<!DOCTYPE hyml>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" 
        content="width=device-width, initial-scale=1.0">
        <title>Multimedia Player</title>
    </head>
    <body>
        <h1>Multimedia Player</h1>
        <section>
            <h2>Freecodecamp audio</h2>
            <audio controls aria-label="audio Damso kietu song">
                <source 
                src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3"
                type="mp3">
            </audio>
        </section>
        <section>
            <h2>Freecodecamp video</h2>
            <video controls width="350px" aria-label="freecodecamp video">
                <source 
                src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4"
                type="mp4">
                <track src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt"
                kind="subtitles"
                srclang="en"
                label="Freecodecamp video subtitles"></track>
        </section>
        <section>
            <h2>Transcript</h2>
            <p>
                fcrfr
            </p>
        </section>
    </body>
</html>
