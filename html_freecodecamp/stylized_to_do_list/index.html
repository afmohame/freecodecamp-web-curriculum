<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport">
    <link rel="stylesheet" href="styles.css">
    <title>Styled To-Do List</title>
</head>

<body>
    <main id="card">
    <h1 id="headtitle">My To-Do List</h1>
    <ul class="todo-list">
        <li class="todo_list_items">
            <input id="first" type="checkbox">
            <label class="labels" for="first">Explore gaming keyboards</label>
            <ul class="sub-item">
                <li class="list_item"><a class="sub-item-link" target="_blank" 
                    href="">Store Link</a></li>
            </ul>
        </li>

        <li class="todo_list_items">
            <input id="second" type="checkbox">
            <label class="labels" for="second">Finish the report</label>
            <ul class="sub-item">
                <li class="list_item"><a class="sub-item-link" target="_blank" 
                    href="">Request Access</a></li>
            </ul>
        </li>

        <li class="todo_list_items">
            <input id="third" type="checkbox">
            <label class="labels" for="third">View Phone's Warranty</label>
            <ul class="sub-item">
                <li class="list_item"><a class="sub-item-link" target="_blank" 
                    href="">View Receipts</a></li>
            </ul>
        </li>

        <li class="todo_list_items">
            <input id="fourth" type="checkbox">
            <label class="labels" for="fourth">Check Processor Specs</label>
            <ul class="sub-item">
                <li class="list_item"><a class="sub-item-link" target="_blank" 
                    href="">View Model Number</a></li>
            </ul>
        </li>
    </ul>
    </main>
</body>
</html>
